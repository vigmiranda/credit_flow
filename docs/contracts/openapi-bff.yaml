openapi: 3.0.3
info:
  title: Credit Flow BFF API
  version: 0.1.0
  description: Contrato inicial do BFF para o MVP de propostas de cartoes.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Servico saudavel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/proposals:
    post:
      summary: Criar proposta
      operationId: createProposal
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
      responses:
        "201":
          description: Proposta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProposalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/proposals/{proposalId}:
    get:
      summary: Consultar proposta
      operationId: getProposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Proposta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/proposals/{proposalId}/status:
    get:
      summary: Consultar status da proposta
      operationId: getProposalStatus
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Status encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/proposals/{proposalId}/customer:
    post:
      summary: Salvar dados do cliente da proposta
      operationId: upsertCustomer
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "202":
          description: Dados recebidos para processamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/proposals/{proposalId}/documents/upload-url:
    post:
      summary: Gerar URL de upload do documento
      operationId: createDocumentUploadUrl
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUploadRequest"
      responses:
        "200":
          description: URL gerada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/proposals/{proposalId}/documents:
    get:
      summary: Listar documentos da proposta
      operationId: listProposalDocuments
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Documentos encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/proposals/{proposalId}/documents/{documentId}/received:
    post:
      summary: Confirmar recebimento do documento
      operationId: markDocumentReceived
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "202":
          description: Documento confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetails"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/proposals/{proposalId}/documents/{documentId}/content:
    post:
      summary: Enviar conteudo do documento
      operationId: uploadDocumentContent
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Documento enviado e workflow disparado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/storage/document-uploaded:
    post:
      summary: Receber callback externo de upload concluido
      operationId: handleStorageDocumentUploaded
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageWebhookRequest"
      responses:
        "202":
          description: Callback aceito e workflow disparado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedWebhookResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/webhooks/partners/credit-analysis:
    post:
      summary: Receber callback externo de analise de credito
      operationId: handlePartnerCreditWebhook
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisWebhookRequest"
      responses:
        "202":
          description: Callback aceito e encaminhado ao workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedAnalysisWebhookResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/webhooks/partners/fraud-analysis:
    post:
      summary: Receber callback externo de analise antifraude
      operationId: handlePartnerFraudWebhook
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisWebhookRequest"
      responses:
        "202":
          description: Callback aceito e encaminhado ao workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedAnalysisWebhookResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /internal/webhooks/audit:
    get:
      summary: Listar auditoria de callbacks recebidos
      operationId: listWebhookAudit
      parameters:
        - name: event_id
          in: query
          required: false
          schema:
            type: string
        - name: callback_type
          in: query
          required: false
          schema:
            type: string
            enum: [storage, credit, fraud]
        - name: proposal_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Registros de auditoria encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAuditListResponse"
  /internal/webhooks/audit/{eventId}/replay-release:
    post:
      summary: Liberar manualmente o replay de um callback
      operationId: releaseWebhookReplay
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Replay liberado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReleaseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /internal/webhooks/audit/cleanup:
    post:
      summary: Limpar registros de auditoria expirados
      operationId: cleanupWebhookAudit
      responses:
        "202":
          description: Limpeza executada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAuditCleanupResponse"
  components:
  parameters:
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: false
      schema:
        type: string
        example: sha256=20ce4ff725f3f2c5ef0b5980d1f2ff97f8ed6ec1cdd3e8a4d9d2c6fa8c579db1
    WebhookEventId:
      name: X-Webhook-Event-Id
      in: header
      required: false
      schema:
        type: string
        example: evt_credit_001
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: false
      schema:
        type: string
        format: date-time
        example: 2026-03-29T12:00:00Z
  responses:
    BadRequest:
      description: Requisicao invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Assinatura do webhook invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Callback rejeitado por rate limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    CreateProposalResponse:
      type: object
      required: [proposal_id, protocol, status]
      properties:
        proposal_id:
          type: string
        protocol:
          type: string
        status:
          type: string
          example: created
    ProposalResponse:
      type: object
      required: [proposal_id, protocol, status, created_at]
      properties:
        proposal_id:
          type: string
        protocol:
          type: string
        status:
          type: string
        customer:
          $ref: "#/components/schemas/CustomerDetails"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDetails"
        analysis_results:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisResult"
        status_history:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistoryEntry"
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEntry"
        webhook_audit:
          type: array
          items:
            $ref: "#/components/schemas/WebhookAuditRecord"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProposalStatusResponse:
      type: object
      required: [proposal_id, status]
      properties:
        proposal_id:
          type: string
        status:
          type: string
        last_updated_at:
          type: string
          format: date-time
    CustomerRequest:
      type: object
      required: [full_name, cpf, birth_date, email, phone, monthly_income]
      properties:
        full_name:
          type: string
        cpf:
          type: string
        birth_date:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        monthly_income:
          type: number
          format: double
    DocumentUploadRequest:
      type: object
      required: [document_type, file_name, content_type]
      properties:
        document_type:
          type: string
          example: id_front
        file_name:
          type: string
        content_type:
          type: string
          example: image/jpeg
    DocumentUploadResponse:
      type: object
      required: [document_id, upload_url, file_key]
      properties:
        document_id:
          type: string
        upload_url:
          type: string
        file_key:
          type: string
        storage_url:
          type: string
          example: http://localhost:9000/proposal-documents/prop_123/id_front/rg.jpg
        status:
          type: string
    CustomerDetails:
      type: object
      description: Dados consolidados do cliente com campos sensiveis mascarados na resposta externa do BFF.
      properties:
        customer_id:
          type: string
        proposal_id:
          type: string
        full_name:
          type: string
        cpf:
          type: string
          example: "*******8901"
        birth_date:
          type: string
        email:
          type: string
          example: "m****@example.com"
        phone:
          type: string
          example: "*******9999"
        monthly_income:
          type: number
          format: double
        address:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentDetails:
      type: object
      properties:
        document_id:
          type: string
        proposal_id:
          type: string
        document_type:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        file_key:
          type: string
        status:
          type: string
        upload_url:
          type: string
        storage_url:
          type: string
        uploaded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentListResponse:
      type: object
      properties:
        proposal_id:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDetails"
    AnalysisResult:
      type: object
      properties:
        analysis_id:
          type: string
        proposal_id:
          type: string
        analysis_type:
          type: string
        result:
          type: string
        provider:
          type: string
        score:
          type: integer
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    StatusHistoryEntry:
      type: object
      properties:
        status_history_id:
          type: string
        proposal_id:
          type: string
        status:
          type: string
        source:
          type: string
        created_at:
          type: string
          format: date-time
    NotificationEntry:
      type: object
      description: Historico de notificacoes com destinatario mascarado.
      properties:
        notification_id:
          type: string
        proposal_id:
          type: string
        channel:
          type: string
        template:
          type: string
        recipient:
          type: string
          example: "m****@example.com"
        message:
          type: string
        status:
          type: string
        trigger_status:
          type: string
        sent_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    AcceptedResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: accepted
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
        details:
          type: object
          additionalProperties: true
    StorageWebhookRequest:
      type: object
      required: [proposal_id, document_id]
      properties:
        proposal_id:
          type: string
        document_id:
          type: string
        provider:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
    AnalysisWebhookRequest:
      type: object
      required: [proposal_id, result]
      properties:
        proposal_id:
          type: string
        provider:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        result:
          type: string
          enum: [approved, manual_review, rejected]
        score:
          type: integer
        reason:
          type: string
    AcceptedWebhookResponse:
      type: object
      required: [status, proposal_id, document_id]
      properties:
        status:
          type: string
          example: accepted
        proposal_id:
          type: string
        document_id:
          type: string
        provider:
          type: string
        event_type:
          type: string
    AcceptedAnalysisWebhookResponse:
      type: object
      required: [status, proposal_id, analysis_type, proposal_status]
      properties:
        status:
          type: string
          example: accepted
        replay_status:
          type: string
          example: processed
        proposal_id:
          type: string
        analysis_type:
          type: string
          enum: [credit, fraud]
        result:
          type: string
        proposal_status:
          type: string
    WebhookAuditRecord:
      type: object
      properties:
        event_id:
          type: string
        callback_type:
          type: string
        correlation_id:
          type: string
        proposal_id:
          type: string
        document_id:
          type: string
        provider:
          type: string
        event_type:
          type: string
        replay_status:
          type: string
        processing_status:
          type: string
        error_code:
          type: string
        error_message:
          type: string
        received_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        retention_expires_at:
          type: string
          format: date-time
        replay_released_at:
          type: string
          format: date-time
        last_replay_action:
          type: string
    WebhookAuditListResponse:
      type: object
      required: [count, records]
      properties:
        count:
          type: integer
        records:
          type: array
          items:
            $ref: "#/components/schemas/WebhookAuditRecord"
    ReplayReleaseResponse:
      type: object
      required: [status, event_id, callback_type, replay_status]
      properties:
        status:
          type: string
          example: accepted
        event_id:
          type: string
        callback_type:
          type: string
        replay_status:
          type: string
          example: released
    WebhookAuditCleanupResponse:
      type: object
      required: [status, removed, processed_at]
      properties:
        status:
          type: string
          example: accepted
        removed:
          type: integer
        processed_at:
          type: string
          format: date-time
