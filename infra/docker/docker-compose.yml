services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-flow-postgres
    environment:
      POSTGRES_DB: credit_flow
      POSTGRES_USER: credit_flow
      POSTGRES_PASSWORD: credit_flow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_flow -d credit_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

