services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-flow-postgres
    environment:
      POSTGRES_DB: credit_flow
      POSTGRES_USER: credit_flow
      POSTGRES_PASSWORD: credit_flow
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_flow -d credit_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: credit-flow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: credit-flow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  mock-oidc:
    build:
      context: ../../services/mock-oidc
    container_name: credit-flow-mock-oidc
    environment:
      MOCK_OIDC_PORT: "8090"
      MOCK_OIDC_ISSUER_URL: http://localhost:19090
      MOCK_OIDC_CLIENT_ID: credit-flow-web
      MOCK_OIDC_CLIENT_SECRET: credit-flow-local-secret
      MOCK_OIDC_DEFAULT_SUB: operator-001
      MOCK_OIDC_DEFAULT_NAME: Local Operator
      MOCK_OIDC_DEFAULT_EMAIL: operator@local.test
      MOCK_OIDC_DEFAULT_ROLE: operations
      MOCK_OIDC_DEFAULT_USERNAME: local.operator
    ports:
      - "19090:8090"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: credit-flow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: credit_flow
      MINIO_ROOT_PASSWORD: credit_flow
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  proposal:
    build:
      context: ../../services/proposal
    container_name: credit-flow-proposal
    environment:
      PROPOSAL_SERVICE_PORT: "8081"
      PROPOSAL_SERVICE_DATABASE_URL: postgres://credit_flow:credit_flow@postgres:5432/credit_flow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  customer:
    build:
      context: ../../services/customer
    container_name: credit-flow-customer
    environment:
      CUSTOMER_SERVICE_PORT: "8082"
      CUSTOMER_SERVICE_DATABASE_URL: postgres://credit_flow:credit_flow@postgres:5432/credit_flow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  document:
    build:
      context: ../../services/document
    container_name: credit-flow-document
    environment:
      DOCUMENT_SERVICE_PORT: "8083"
      DOCUMENT_SERVICE_DATABASE_URL: postgres://credit_flow:credit_flow@postgres:5432/credit_flow?sslmode=disable
      DOCUMENT_SERVICE_UPLOAD_BASE_URL: http://localhost:9000/proposal-documents
      DOCUMENT_STORAGE_ENDPOINT: minio:9000
      DOCUMENT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      DOCUMENT_STORAGE_ACCESS_KEY: credit_flow
      DOCUMENT_STORAGE_SECRET_KEY: credit_flow
      DOCUMENT_STORAGE_BUCKET: proposal-documents
      DOCUMENT_STORAGE_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  credit-analysis:
    build:
      context: ../../services/credit-analysis
    container_name: credit-flow-credit-analysis
    environment:
      CREDIT_ANALYSIS_SERVICE_PORT: "8085"

  fraud-analysis:
    build:
      context: ../../services/fraud-analysis
    container_name: credit-flow-fraud-analysis
    environment:
      FRAUD_ANALYSIS_SERVICE_PORT: "8086"

  notification:
    build:
      context: ../../services/notification
    container_name: credit-flow-notification
    environment:
      NOTIFICATION_SERVICE_PORT: "8087"
      NOTIFICATION_SERVICE_DATABASE_URL: postgres://credit_flow:credit_flow@postgres:5432/credit_flow?sslmode=disable
      NOTIFICATION_SERVICE_ENCRYPTION_KEY: credit-flow-local-notification-key
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
      NOTIFICATION_SMTP_FROM: credit-flow@local.test
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  workflow:
    build:
      context: ../../services/workflow
    container_name: credit-flow-workflow
    environment:
      WORKFLOW_SERVICE_PORT: "8084"
      WORKFLOW_REDIS_URL: redis://redis:6379/0
      WORKFLOW_QUEUE_NAME: workflow:proposal-analysis
      WORKFLOW_WORKER_COUNT: "1"
      WORKFLOW_MAX_RETRIES: "2"
      WORKFLOW_ANALYSIS_DELAY_MS: "250"
      WORKFLOW_SERVICE_PROPOSAL_URL: http://proposal:8081
      WORKFLOW_SERVICE_CUSTOMER_URL: http://customer:8082
      WORKFLOW_SERVICE_DOCUMENT_URL: http://document:8083
      WORKFLOW_SERVICE_CREDIT_URL: http://credit-analysis:8085
      WORKFLOW_SERVICE_FRAUD_URL: http://fraud-analysis:8086
      WORKFLOW_SERVICE_NOTIFICATION_URL: http://notification:8087
    depends_on:
      proposal:
        condition: service_started
      customer:
        condition: service_started
      document:
        condition: service_started
      credit-analysis:
        condition: service_started
      fraud-analysis:
        condition: service_started
      notification:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "18084:8084"

  bff:
    build:
      context: ../../services/bff
    container_name: credit-flow-bff
    environment:
      BFF_PORT: "8080"
      PROPOSAL_SERVICE_URL: http://proposal:8081
      CUSTOMER_SERVICE_URL: http://customer:8082
      DOCUMENT_SERVICE_URL: http://document:8083
      WORKFLOW_SERVICE_URL: http://workflow:8084
      NOTIFICATION_SERVICE_URL: http://notification:8087
      BFF_WEBHOOK_SECRET: credit-flow-local-webhook-secret
    depends_on:
      proposal:
        condition: service_started
      customer:
        condition: service_started
      document:
        condition: service_started
      workflow:
        condition: service_started
      notification:
        condition: service_started
    ports:
      - "18080:8080"

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_BFF_URL: http://localhost:18080
    container_name: credit-flow-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BFF_URL: http://localhost:18080
      AUTH_MODE: oidc
      OIDC_ISSUER_URL: http://localhost:19090
      OIDC_DISCOVERY_URL: http://mock-oidc:8090/.well-known/openid-configuration
      OIDC_CLIENT_ID: credit-flow-web
      OIDC_CLIENT_SECRET: credit-flow-local-secret
      OIDC_AUTHORIZE_PATH: /authorize
      OIDC_TOKEN_PATH: /token
      OIDC_TOKEN_URL: http://mock-oidc:8090/token
      OIDC_USERINFO_PATH: /userinfo
      OIDC_USERINFO_URL: http://mock-oidc:8090/userinfo
      OIDC_JWKS_URL: http://mock-oidc:8090/jwks
      OIDC_REDIRECT_URI: http://localhost:3000/api/auth/callback
    depends_on:
      bff:
        condition: service_started
      mock-oidc:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
