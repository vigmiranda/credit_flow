services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-flow-postgres
    environment:
      POSTGRES_DB: credit_flow
      POSTGRES_USER: credit_flow
      POSTGRES_PASSWORD: credit_flow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_flow -d credit_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: credit-flow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: credit-flow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
  minio:
    image: minio/minio:RELEASE.2026-01-03T00-00-00Z
    container_name: credit-flow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: credit_flow
      MINIO_ROOT_PASSWORD: credit_flow
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
